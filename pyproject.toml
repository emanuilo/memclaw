[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memclaw"
version = "3.0.0"
description = "A lightweight, local-first personal memory assistant powered by AI"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Emanuilo Jovanovic", email = "emanuilo.jovanovic@hotmail.com" },
]
requires-python = ">=3.10"
keywords = ["memory", "ai", "assistant", "vector-search", "personal-knowledge", "second-brain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "claude-agent-sdk>=0.2.163,<0.3",
    "mcp>=1.23.0,<2",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "python-telegram-bot>=21.0",
    "slack-bolt>=1.18.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "curl-cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "neonize>=0.3.16",
]

[project.scripts]
memclaw = "memclaw.cli:cli"

[project.urls]
Repository = "https://github.com/emanuilo/memclaw"
Issues = "https://github.com/emanuilo/memclaw/issues"

[project.optional-dependencies]
cursor = [
    "cursor-sdk>=0.1.4,<0.2",
]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
    "import-linter>=2.12",
    "cursor-sdk>=0.1.4,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["memclaw"]

[tool.ruff.lint]
# Pin the rule set so a newer ruff (CI installs the latest) doesn't turn on
# new default rules. These are ruff's defaults.
select = ["E4", "E7", "E9", "F"]
# PLC0415: imports go at the top of the file. Keeps lazy imports deliberate
# and visible: each one needs `# noqa: PLC0415 - <reason>`. (Hidden cycles are
# caught by lint-imports, which also sees function-local imports.)
# RUF100: a `# noqa` that no longer suppresses anything fails, so they can't
# go stale.
extend-select = ["PLC0415", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# - cli.py: each subcommand loads only what it needs, so `memclaw chat` doesn't
#   pull in the Telegram/Slack/WhatsApp SDKs. Nothing imports cli.
# - tests: imports inside tests are normal (patching, optional deps).
"memclaw/cli.py" = ["PLC0415"]
"tests/**" = ["PLC0415"]

# ---------------------------------------------------------------------------
# Module-structure rules, checked by `lint-imports` (import-linter) in CI.
# Run locally with:  lint-imports
#
# Don't add ignore_imports to silence a broken contract: fix the import, or
# move the module to another layer if the new dependency is legitimate.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "memclaw"
# Needed so the "chat SDKs" contract below can see third-party packages.
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: a module may only import modules in layers BELOW it (entry points -> agent -> backends -> tools -> core -> config)"
type = "layers"
containers = ["memclaw"]
layers = [
    # Entry point: the `memclaw` command.
    "cli",
    # Front-ends started by the CLI: the chat bots and the interactive setup
    # wizard. Independent (`|`): bots don't run the wizard and vice versa.
    "bot | setup",
    # Platform-agnostic assistant: wires backends, tools and storage together.
    "agent",
    # AI agent backends (Claude, Cursor) and their MCP plumbing.
    "backends",
    # The memory tools the agent can call.
    "tools",
    # Independent building blocks (`|`: they don't import each other).
    "search | store | reminders | sessions | memory_refs | prompts | openai_health",
    # SQLite + embeddings index, used by search.
    "index",
    # Settings read from the environment. Imports nothing from memclaw.
    "config",
]
# Every top-level module must be placed in a layer above; a new module fails
# lint-imports until someone decides where it belongs.
exhaustive = true
# Data files (AGENTS.md, Cursor hook script) copied out at runtime, not code
# that is imported. Covered by its own contract below.
exhaustive_ignores = ["defaults"]

[[tool.importlinter.contracts]]
id = "no-cycles-in-subpackages"
name = "No circular imports between modules inside a subpackage (e.g. memclaw.backends, memclaw.bot)"
type = "acyclic_siblings"
# Top-level modules are already kept acyclic by the layers contract; this
# covers the modules inside each subpackage, at any depth.
ancestors = ["memclaw.*"]

[[tool.importlinter.contracts]]
id = "chat-platforms-independent"
name = "Chat platforms are independent: the Telegram, Slack and WhatsApp handlers never import each other (share code via memclaw.bot or lower layers)"
type = "independence"
modules = [
    "memclaw.bot.handlers",           # Telegram
    "memclaw.bot.slack_handlers",
    "memclaw.bot.whatsapp_handlers",
]

[[tool.importlinter.contracts]]
id = "chat-sdks-only-in-bot"
name = "Chat-platform SDKs (telegram, slack_bolt, neonize) are only imported inside memclaw.bot"
type = "protected"
protected_modules = ["telegram", "slack_bolt", "neonize"]
allowed_importers = ["memclaw.bot"]

[[tool.importlinter.contracts]]
id = "defaults-standalone"
name = "memclaw.defaults imports nothing from memclaw (its Cursor hook script is copied to ~/.memclaw and run on its own)"
type = "forbidden"
source_modules = ["memclaw.defaults"]
forbidden_modules = ["memclaw.*"]

[[tool.importlinter.contracts]]
id = "backend-internals-private"
name = "Only memclaw.backends itself imports the concrete backends (everyone else goes through memclaw.backends / memclaw.backends.base)"
type = "protected"
protected_modules = [
    "memclaw.backends.claude",
    "memclaw.backends.claude_models",
    "memclaw.backends.cursor",
    "memclaw.backends.cursor_hooks",
    "memclaw.backends.cursor_sdk_adapter",
    "memclaw.backends.mcp_bridge",
    "memclaw.backends.mcp_tools",
    "memclaw.backends.model_selection",
    "memclaw.backends.tool_policy",
]
allowed_importers = ["memclaw.backends"]
