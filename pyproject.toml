[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memclaw"
version = "3.0.0"
description = "A lightweight, local-first personal memory assistant powered by AI"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Emanuilo Jovanovic", email = "emanuilo.jovanovic@hotmail.com" },
]
requires-python = ">=3.10"
keywords = ["memory", "ai", "assistant", "vector-search", "personal-knowledge", "second-brain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "claude-agent-sdk>=0.2.163,<0.3",
    "mcp>=1.23.0,<2",
    # The MCP bridge (backends/mcp_bridge.py) serves HTTP with these directly.
    "starlette>=0.27",
    "uvicorn>=0.31.1",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "python-telegram-bot>=21.0",
    "slack-bolt>=1.18.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "curl-cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "neonize>=0.3.16",
]

[project.scripts]
memclaw = "memclaw.cli:cli"

[project.urls]
Repository = "https://github.com/emanuilo/memclaw"
Issues = "https://github.com/emanuilo/memclaw/issues"

[project.optional-dependencies]
cursor = [
    "cursor-sdk>=0.1.4,<0.2",
]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
    "cursor-sdk>=0.1.4,<0.2",
]

# Development-only groups (PEP 735). Unlike the extras above they are not part
# of the published package metadata, so they may use a git URL (PyPI rejects
# those in extras). Install with `pip install -e ".[dev]" --group shape`
# (pip >= 25.1) or `uv sync --extra dev --group shape`.
[dependency-groups]
# code-shape-kit: the `code-shape` checks (CI and pre-commit hooks). It needs
# Python 3.11.4+ while memclaw also supports 3.10, hence the marker.
shape = [
    "code-shape-kit[tools] @ git+https://github.com/emanuilo/code-shape-kit@v0.3.0 ; python_full_version >= '3.11.4'",
]

[tool.hatch.build.targets.wheel]
packages = ["memclaw"]

[tool.ruff.lint]
# General correctness lint (unused imports, undefined names, ...). Shape rules
# (complexity, sizes, coupling) are code-shape-kit's job, not ruff's here.
# Pin the rule set so a newer ruff (CI installs the latest) doesn't turn on
# new default rules. These are ruff's defaults.
select = ["E4", "E7", "E9", "F"]

# ---------------------------------------------------------------------------
# Code shape (sizes, complexity, coupling, dead code, dependencies, types),
# checked by `code-shape check` (code-shape-kit) in CI and in the pre-commit
# hooks. Known violations are listed in .code-shape/baseline.json: only new or
# worse ones fail. Never edit the baseline by hand; fix the code, then run
# `code-shape tighten`. The kit's default limits apply (see its
# code_shape/templates/shape.toml) unless [tool.shape.limits] below sets a
# stricter one; don't raise one to make a change pass.
# ---------------------------------------------------------------------------
[tool.shape]
packages = ["memclaw"]
tests = "tests"
# The only modules that may read or set environment variables (os.environ,
# os.getenv): every setting is declared in memclaw/config.py and passed down
# from MemclawConfig. The Cursor hook script is copied out of the package and
# run on its own, so it reads its env itself.
config_modules = ["memclaw/config.py", "memclaw/defaults/cursor_hooks/*"]
# The only modules that may print(): the kit's default entry points, plus the
# Cursor hook script, which answers Cursor by printing JSON to stdout. The rest
# of memclaw writes to the terminal through rich's console, and logs with loguru.
output_modules = ["*/cli.py", "*/__main__.py", "memclaw/defaults/cursor_hooks/*"]
baseline = ".code-shape/baseline.json"

[tool.shape.limits]
# Lower than the kit's 12: no module imports more than 8 memclaw modules
# (the agent and the Cursor backend are at 8, cli at 5), so hold it there.
fan_out = 8

[tool.shape.banned_api]
# Outside systems should be reached through one module each. Existing direct
# uses are in the baseline; new ones fail.
"openai" = { msg = "Only memclaw/openai_client.py imports the OpenAI SDK. Call OpenAIClient (embed, transcribe, chat), or add the call there.", allowed = ["memclaw/openai_client.py"] }
"sqlite3" = { msg = "Only the storage modules (memclaw/memory/index.py for the search index, memclaw/reminders.py) open SQLite; call their methods instead, or add the query there.", allowed = ["memclaw/memory/index.py", "memclaw/reminders.py"] }
# Settings come from memclaw/config.py only (config_modules above bans os.environ elsewhere); .env files too.
"dotenv" = { msg = "Only memclaw/config.py loads .env files. Use its read_env_file / update_env_file / reload_env_file, or add a setting there and read it from MemclawConfig.", allowed = ["memclaw/config.py"] }

[tool.shape.error_boundaries]
# Functions that deliberately catch every error and keep going without a
# traceback (each with its reason; changes need the CODEOWNERS review). Not
# for debt: a new catch-all is fixed in the code, not added here.
"memclaw/agent.py:MemclawAgent.start_background_sync._sync_loop" = "Background index sync runs every minute and is often offline; a warning, not a traceback, each time."
"memclaw/bot/telegram.py:_typing_loop" = "Best-effort typing indicator; a failed chat action must never stop the reply."
"memclaw/bot/telegram.py:TelegramBot._send_response" = "Falls back to plain text when Telegram rejects the agent's Markdown."
"memclaw/backends/base.py:report_tool_step" = "A failing progress callback must not break the agent's tool step."
"memclaw/reminders.py:ReminderScheduler._tick" = "The reminder loop must keep running; each failure is logged and retried next poll."
"memclaw/bot/links.py:LinkProcessor.fetch_content" = "Any fetch failure means 'no content'; the link is still saved."
"memclaw/backends/claude/configure.py:ask_model_and_effort" = "If the model list can't be loaded, keep the current model and tell the user why."
"memclaw/bot/terminal.py:chat" = "The terminal chat loop shows the error to the user and keeps going."
"memclaw/setup/doctor.py:check_openai" = "Health check: the failure is shown to the user as the result."
"memclaw/openai_client.py:_probe_embedding" = "Health probe: the failure is the result, reported to the user."
"memclaw/openai_client.py:_probe_chat" = "Health probe: the failure is the result, reported to the user."
"memclaw/openai_client.py:_probe_whisper" = "Health probe: the failure is the result, reported to the user."
"memclaw/memory/vault.py:MemoryVault.sync_or_warn" = "Startup index sync is optional (e.g. offline); warn and let the bot start."

[tool.shape.extra_args]
# - dev tools live in the `dev` extra; docs/ holds a demo-capture script.
# - aiohttp is never imported by memclaw, but slack_bolt.async_app (Slack) needs
#   it at runtime and slack-bolt doesn't declare it.
deptry = ["--optional-dependencies-dev-groups", "dev", "--extend-exclude", "docs", "--per-rule-ignores", "DEP002=aiohttp"]
# - functions registered by decorator are called by their framework, not by name.
vulture = ["--ignore-decorators", "@cli.command,@*.event,@server.list_tools,@server.call_tool"]

[[tool.mypy.overrides]]
# neonize (WhatsApp) ships no type hints or stubs.
module = ["neonize.*"]
ignore_missing_imports = true

[tool.vulture]
# Names a library uses by reflection, which vulture would call dead code.
ignore_names = [
    "should_exit",  # uvicorn reads Server.should_exit; backends/mcp_bridge.py only sets it
]

[tool.shape.concepts]
# The ideas a change is usually about (tracked in `code-shape report`, never a
# gate): words that name each one in code, and the module that should own it.
"memory notes (daily files)" = { terms = ["MemoryStore", "daily_file", "memory_save"], home = "memclaw/memory/notes.py" }
"MEMORY.md + consolidation" = { terms = ["consolidat", "MEMORY\\.md", "permanent_memory"], home = "memclaw/memory/consolidation.py" }
"search + index" = { terms = ["HybridSearch", "MemoryIndex", "embedding"], home = "memclaw/memory/index.py" }
"reminders" = { terms = ["remind"], home = "memclaw/reminders.py" }
"settings storage (.env)" = { terms = ["read_env_file", "update_env_file", "write_env_file", "os\\.environ"], home = "memclaw/config.py" }
"AI backends" = { terms = ["AgentBackend", "build_backend", "agent_backend", "AGENT_BACKEND"], home = "memclaw/backends/base.py" }
"model / effort selection" = { terms = ["set_model", "set_effort", "list_models", "effort_levels"], home = "memclaw/backends/model_selection.py" }
"chat platforms" = { terms = ["telegram", "slack", "whatsapp"], home = "memclaw/bot/__init__.py" }
"voice transcription" = { terms = ["whisper", "transcri"], home = "memclaw/bot/inbound.py" }
"images" = { terms = ["image_save", "image_search", "platform_image"], home = "memclaw/memory/index.py" }
"agent tools" = { terms = ["TOOL_DEFINITIONS", "ToolExecutor"], home = "memclaw/tools/catalog.py" }
"conversations / sessions" = { terms = ["SessionStore", "session_key", "reset_session"], home = "memclaw/sessions.py" }
"setup wizard" = { terms = ["run_setup", "wizard", "needs_setup"], home = "memclaw/setup/wizard.py" }
"links" = { terms = ["LinkProcessor", "process_links"], home = "memclaw/bot/links.py" }

# ---------------------------------------------------------------------------
# Module-structure rules (import-linter contracts): memclaw's own layout.
# `code-shape check` runs them; on their own:  lint-imports
#
# Don't add ignore_imports to silence a broken contract: fix the import, or
# move the module to another layer if the new dependency is legitimate.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "memclaw"
# Needed so the "chat SDKs" contract below can see third-party packages.
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: a module may only import modules in layers BELOW it (entry points -> agent -> backends -> tools -> memory -> core -> config)"
type = "layers"
containers = ["memclaw"]
layers = [
    # Entry point: the `memclaw` command.
    "cli",
    # Setting up from the terminal (memclaw.setup): the wizard and the doctor
    # report. It lists the chat platforms from memclaw.bot's registry and
    # lets the chosen backend ask its own questions.
    "setup",
    # Where Memclaw chats (memclaw.bot): one module per chat app and one for
    # the terminal, plus what they share.
    "bot",
    # Platform-agnostic assistant: wires backends, tools and storage together.
    "agent",
    # AI agent backends (Claude, Cursor) and their MCP plumbing.
    "backends",
    # The memory tools the agent can call.
    "tools",
    # The memory subsystem (memclaw.memory): the notes, search over them, and
    # MEMORY.md consolidation (the only writer of MEMORY.md). It builds on the
    # modules below and reaches the LLM through the backend the agent hands
    # it, so it doesn't import backends.
    "memory",
    # Independent building blocks (`|`: they don't import each other).
    "reminders | sessions | terminal_input | instructions",
    # The OpenAI adapter (embeddings, transcription, chat), used by the
    # memory index and bot.
    "openai_client",
    # Settings read from the environment. Imports nothing from memclaw.
    "config",
]
# Every top-level module must be placed in a layer above; a new module fails
# lint-imports until someone decides where it belongs.
exhaustive = true
# Data files (AGENTS.md, Cursor hook script) copied out at runtime, not code
# that is imported. Covered by its own contract below.
exhaustive_ignores = ["defaults"]

[[tool.importlinter.contracts]]
id = "no-cycles-in-subpackages"
name = "No circular imports between modules inside a subpackage (e.g. memclaw.backends, memclaw.bot)"
type = "acyclic_siblings"
# Top-level modules are already kept acyclic by the layers contract; this
# covers the modules inside each subpackage, at any depth.
ancestors = ["memclaw.*"]

[[tool.importlinter.contracts]]
id = "chat-platforms-independent"
name = "Chat platforms are independent: the Telegram, Slack, WhatsApp and terminal modules never import each other (share code via memclaw.bot.inbound or lower layers)"
type = "independence"
modules = [
    "memclaw.bot.telegram",
    "memclaw.bot.slack",
    "memclaw.bot.whatsapp",
    "memclaw.bot.terminal",
]

[[tool.importlinter.contracts]]
id = "platforms-via-registry"
name = "Only memclaw.bot imports the platform modules: everyone else starts a platform through memclaw.bot.PLATFORMS"
type = "protected"
protected_modules = [
    "memclaw.bot.telegram",
    "memclaw.bot.slack",
    "memclaw.bot.whatsapp",
    "memclaw.bot.terminal",
]
allowed_importers = ["memclaw.bot"]

[[tool.importlinter.contracts]]
id = "chat-sdks-only-in-bot"
name = "Chat-platform SDKs (telegram, slack_bolt, neonize) are only imported by the platform modules in memclaw.bot"
type = "protected"
protected_modules = ["telegram", "slack_bolt", "neonize"]
allowed_importers = ["memclaw.bot.telegram", "memclaw.bot.slack", "memclaw.bot.whatsapp"]

[[tool.importlinter.contracts]]
id = "openai-only-in-adapter"
name = "Only memclaw.openai_client imports the OpenAI SDK (everyone else calls OpenAIClient)"
type = "protected"
protected_modules = ["openai"]
allowed_importers = ["memclaw.openai_client"]

[[tool.importlinter.contracts]]
id = "memory-via-package"
name = "Only memclaw.memory imports its own modules: everyone else uses what memclaw.memory exports (MemoryStore, MemoryIndex, HybridSearch, Consolidator, MemoryVault, ...)"
type = "protected"
protected_modules = [
    "memclaw.memory.chunking",
    "memclaw.memory.consolidation",
    "memclaw.memory.index",
    "memclaw.memory.notes",
    "memclaw.memory.refs",
    "memclaw.memory.search",
    "memclaw.memory.vault",
]
allowed_importers = ["memclaw.memory"]

[[tool.importlinter.contracts]]
id = "memory-layers"
name = "Inside memclaw.memory: consolidation and search build on the notes and the index, never the other way round"
type = "layers"
containers = ["memclaw.memory"]
layers = [
    # The notes and the index opened together for the one-off commands.
    "vault",
    # MEMORY.md consolidation; ranking search results. Independent.
    "consolidation | search",
    # The Markdown notes; the SQLite index of them (the only SQLite user
    # here); the reference check consolidation runs.
    "notes | index | refs",
    # Splitting a note into chunks, used by index.
    "chunking",
]
# A new module inside memclaw.memory must be placed in a layer above.
exhaustive = true

[[tool.importlinter.contracts]]
id = "tools-via-package"
name = "Only memclaw.tools imports its own modules: everyone else uses what memclaw.tools exports (TOOL_DEFINITIONS, ToolExecutor, ToolContext, describe_tool_call)"
type = "protected"
protected_modules = [
    "memclaw.tools.catalog",
    "memclaw.tools.context",
    "memclaw.tools.executor",
    "memclaw.tools.files",
    "memclaw.tools.images",
    "memclaw.tools.memory",
    "memclaw.tools.reminders",
]
allowed_importers = ["memclaw.tools"]

[[tool.importlinter.contracts]]
id = "setup-via-package"
name = "Only memclaw.setup imports its own modules: everyone else uses what memclaw.setup exports (run_setup, needs_setup, print_logo, run_doctor)"
type = "protected"
protected_modules = ["memclaw.setup.doctor", "memclaw.setup.wizard"]
allowed_importers = ["memclaw.setup"]

[[tool.importlinter.contracts]]
id = "defaults-standalone"
name = "memclaw.defaults imports nothing from memclaw (its Cursor hook script is copied to ~/.memclaw and run on its own)"
type = "forbidden"
source_modules = ["memclaw.defaults"]
forbidden_modules = ["memclaw.*"]

[[tool.importlinter.contracts]]
id = "backend-internals-private"
name = "Only memclaw.backends itself imports the concrete backends (everyone else goes through memclaw.backends / memclaw.backends.base)"
type = "protected"
protected_modules = [
    # Packages: their modules are protected with them.
    "memclaw.backends.claude",
    "memclaw.backends.cursor",
    "memclaw.backends.mcp_bridge",
    "memclaw.backends.mcp_tools",
    "memclaw.backends.model_selection",
    "memclaw.backends.tool_policy",
]
allowed_importers = ["memclaw.backends"]
