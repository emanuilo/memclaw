name: E2E memory validation

# Runs tests/e2e against the real OpenAI and Claude APIs. Manual only:
# it costs API credits. Needs the OPENAI_API_KEY and ANTHROPIC_API_KEY
# repository secrets.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model for the agent tests
        default: claude-haiku-5-5

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run end-to-end tests
        env:
          MEMCLAW_E2E: "1"
          MEMCLAW_E2E_MODEL: ${{ inputs.model }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest tests/e2e -v
