name: CI

on:
  push:
    branches: [main]
  # Every PR, so stacked PRs (based on another PR's branch) get checked too.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check memclaw tests

      - name: Run tests
        run: pytest

  shape:
    # Code shape gates (code-shape-kit): sizes, complexity, coupling, dead
    # code, dependencies, type errors, and memclaw's import-linter contracts.
    # Runs once, from uv.lock, so the numbers (e.g. type errors per file) come
    # from the same package versions the baseline was recorded with. The
    # history-based checks aren't gates, so a shallow checkout is enough.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and code-shape-kit
        run: |
          pip install uv==0.11.17
          uv sync --locked --python 3.12 --extra dev --group shape

      - name: Code shape gates
        run: uv run --no-sync code-shape check
